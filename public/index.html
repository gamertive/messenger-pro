<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="authScreen" class="screen active">
        <div class="auth-card">
            <span class="material-symbols-rounded logo-icon">chat_bubble</span>
            <h1>Messenger</h1>
            <div class="tabs">
                <button class="tab active" data-tab="login">Вход</button>
                <button class="tab" data-tab="register">Регистрация</button>
            </div>
            <form id="loginForm" class="form active">
                <div class="input-group">
                    <span class="material-symbols-rounded input-icon">person</span>
                    <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
                </div>
                <div class="input-group">
                    <span class="material-symbols-rounded input-icon">lock</span>
                    <input type="password" id="loginPassword" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <form id="registerForm" class="form">
                <div class="input-group">
                    <span class="material-symbols-rounded input-icon">person_add</span>
                    <input type="text" id="regUsername" placeholder="Придумайте имя" required>
                </div>
                <div class="input-group">
                    <span class="material-symbols-rounded input-icon">lock</span>
                    <input type="password" id="regPassword" placeholder="Придумайте пароль" required>
                </div>
                <button type="submit" class="btn-primary">Создать аккаунт</button>
            </form>
            <div id="authError" class="error-text"></div>
        </div>
    </div>

    <div id="mainScreen" class="screen">
        <button id="mobileBackBtn" class="mobile-back-btn">
            <span class="material-symbols-rounded">arrow_back</span>
        </button>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Чаты</h2>
                <div class="user-chip">
                    <span class="material-symbols-rounded">account_circle</span>
                    <span id="currentUsername">User</span>
                    <button id="logoutBtn" title="Выйти">
                        <span class="material-symbols-rounded">logout</span>
                    </button>
                </div>
            </div>
            <div class="chat-tabs">
                <button class="chat-tab active" data-chat="general">
                    <span class="material-symbols-rounded">public</span> Общий
                </button>
                <button class="chat-tab" data-chat="private">
                    <span class="material-symbols-rounded">person</span> Личные
                </button>
            </div>
            <div id="usersList" class="users-list"></div>
            <button id="settingsBtn" class="settings-btn">
                <span class="material-symbols-rounded">settings</span> Настройки
            </button>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <button id="menuBtn" class="icon-btn mobile-only">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="chat-info">
                    <h3 id="chatTitle">Общий чат</h3>
                    <span id="callStatus" class="call-status"></span>
                </div>
                <div class="call-buttons" id="callButtons" style="display:none;">
                    <button id="audioCallBtn" class="icon-btn" title="Аудиозвонок">
                        <span class="material-symbols-rounded">call</span>
                    </button>
                    <button id="videoCallBtn" class="icon-btn" title="Видеозвонок">
                        <span class="material-symbols-rounded">videocam</span>
                    </button>
                </div>
            </div>
            
            <div class="chat-box" id="messages"></div>
            
            <div class="input-area">
                <div class="input-wrapper">
                    <button id="emojiBtn" class="input-icon-btn">
                        <span class="material-symbols-rounded">mood</span>
                    </button>
                    <button id="imageBtn" class="input-icon-btn">
                        <span class="material-symbols-rounded">image</span>
                    </button>
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <input type="text" id="messageInput" placeholder="Сообщение..." autocomplete="off">
                </div>
                <button id="sendBtn" class="send-btn">
                    <span class="material-symbols-rounded">send</span>
                </button>
            </div>
            <div id="emojiPicker" class="emoji-picker"></div>
        </div>
    </div>

    <!-- Модалка настроек -->
    <div id="settingsModal" class="modal" style="display:none;">
        <div class="modal-content settings-modal">
            <div class="settings-header">
                <h2>Настройки</h2>
                <button id="closeSettingsBtn" class="icon-btn">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <span class="material-symbols-rounded">dark_mode</span>
                    <span>Тёмная тема</span>
                    <label class="switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="incomingCallModal" class="modal" style="display:none;">
        <div class="modal-content call-modal">
            <span class="material-symbols-rounded call-icon-large">ring_volume</span>
            <h2>Входящий звонок</h2>
            <p id="callerName">Имя</p>
            <p id="callType" class="subtitle">Видеозвонок</p>
            <div class="call-actions">
                <button id="rejectCallBtn" class="btn-circle reject">
                    <span class="material-symbols-rounded">call_end</span>
                </button>
                <button id="acceptCallBtn" class="btn-circle accept">
                    <span class="material-symbols-rounded">call</span>
                </button>
            </div>
        </div>
    </div>

    <div id="callWindow" class="call-window" style="display:none;">
        <div class="call-header-overlay">
            <span id="callPartner">Имя</span>
            <span id="callConnectionStatus" class="connection-status connecting">Подключение...</span>
            <span id="callTimer">00:00</span>
        </div>
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button id="muteBtn" class="btn-circle control">
                <span class="material-symbols-rounded">mic</span>
            </button>
            <button id="cameraBtn" class="btn-circle control">
                <span class="material-symbols-rounded">videocam</span>
            </button>
            <button id="endCallBtn" class="btn-circle end">
                <span class="material-symbols-rounded">call_end</span>
            </button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
